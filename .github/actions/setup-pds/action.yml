name: PDS-Umgebung
description: >
  Python, Qt-Systembibliotheken und Python-Pakete fuer die Pruefungen —
  einmal hier statt in jedem Job kopiert.

inputs:
  python:
    description: Python-Version
    default: "3.13"
  qt:
    description: Qt-Systembibliotheken + PyQt6/numpy installieren
    default: "true"
  pyqtgraph:
    description: pyqtgraph dazu (Plotter, Oberflaeche)
    default: "false"
  platformio:
    description: PlatformIO dazu (Firmware)
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python }}
        cache: pip
        cache-dependency-path: requirements.txt

    # Das pip-Paket PyQt6 bringt Qt selbst mit, aber nicht dessen System-
    # abhaengigkeiten: ohne libEGL wirft schon `import PyQt6.QtGui`. Ohne
    # eine einzige Schrift meldet Qt bei jedem Textelement eine Warnung —
    # und der Smoketest wertet jede Qt-Warnung als Fehler.
    - name: Qt-Systembibliotheken
      if: inputs.qt == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
          libxkbcommon0 libfontconfig1 libfreetype6 fonts-dejavu-core

    - name: Python-Pakete
      shell: bash
      run: |
        python -m pip install --upgrade pip -q
        pkgs="pyflakes"
        [[ "${{ inputs.qt }}" == "true" ]] && pkgs="$pkgs numpy PyQt6"
        [[ "${{ inputs.pyqtgraph }}" == "true" ]] && pkgs="$pkgs pyqtgraph"
        [[ "${{ inputs.platformio }}" == "true" ]] && pkgs="$pkgs platformio"
        python -m pip install -q $pkgs

    - name: PlatformIO-Pakete zwischenspeichern
      if: inputs.platformio == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: pio-${{ runner.os }}-${{ hashFiles('teensy_firmware/platformio.ini') }}
        restore-keys: pio-${{ runner.os }}-
