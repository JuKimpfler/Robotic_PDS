name: CI

# Prueft bei jedem Push und jedem Pull Request alles, was sich ohne Hardware
# pruefen laesst — genau die Faelle, die man sonst erst am Spielfeldrand
# bemerkt: abweichendes Wire-Format zwischen Teensy/Node/GUI, eine QML-Datei
# die nicht mehr laedt, ein Deskriptor der kein gueltiges JSON mehr ist, und
# eine Firmware die gar nicht mehr uebersetzt.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  1) Python: Selbsttest, Wire-Format, QML-Bindungen, Linting
  # ══════════════════════════════════════════════════════════════════════
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Systembibliotheken fuer Qt
        # Das pip-Paket PyQt6 bringt Qt selbst mit, aber nicht dessen
        # Systemabhaengigkeiten. Ohne libEGL.so.1 wirft bereits
        # `import PyQt6.QtGui` einen ImportError — Abschnitt 15 des
        # Selbsttests (Plotter-Marken, Controller-Mapping) faellt dann aus.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libfontconfig1 libfreetype6

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes numpy PyQt6

      - name: Selbsttest (ohne Hardware)
        run: python tools/selftest.py

      - name: Wire-Format Teensy/Node/GUI
        run: python tools/check_wire_format.py

      - name: QML-Zugriffe gegen die Python-Bruecken
        run: python tools/check_qml_bindings.py

      - name: pyflakes
        run: |
          # extra_script.py bekommt seine Namen von PlatformIO.
          python -m pyflakes \
            rpi5_monitor/64Bit_Version/*.py \
            rpi5_monitor/64Bit_Version/bridge/*.py \
            rpi_zero_node/*.py \
            shared/*.py \
            pc_flash_tool/*.py \
            tools/*.py

      - name: Shell-Skripte pruefen
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "-- $f"
            bash -n "$f"
          done

  # ══════════════════════════════════════════════════════════════════════
  #  2) Oberflaeche wirklich starten (Offscreen)
  # ══════════════════════════════════════════════════════════════════════
  gui:
    name: QML-Oberflaeche laedt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Systembibliotheken fuer Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libfontconfig1 libfreetype6 \
            fonts-dejavu-core
          # fonts-dejavu-core: libfontconfig bringt selbst keine Schrift mit.
          # Ohne eine einzige installierte Schriftart meldet Qt beim Aufbau
          # jedes Textelements eine Warnung — und der Smoketest wertet jede
          # Qt-Warnung als Fehler.

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PyQt6

      - name: Main.qml offscreen starten
        run: python tools/qml_smoketest.py

  # ══════════════════════════════════════════════════════════════════════
  #  3) Teensy: Deskriptor wirklich ausfuehren + Firmware uebersetzen
  # ══════════════════════════════════════════════════════════════════════
  teensy:
    name: Teensy-Bibliothek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Deskriptor auf dem Host ausfuehren und JSON pruefen
        run: python tools/desc_json_check.py

      - name: PlatformIO installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: PlatformIO-Pakete zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('teensy_firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Firmware uebersetzen
        working-directory: teensy_firmware
        run: pio run

      - name: Bibliothek in mehreren Konfigurationen uebersetzen
        run: bash tools/build_teensy_check.sh
