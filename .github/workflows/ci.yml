name: CI

# Prueft bei jedem Push und Pull Request alles, was sich ohne Hardware pruefen
# laesst. Jeder Job ruft genau eine Stufe von tools/check_all.sh auf — lokal
# laeuft mit `bash tools/check_all.sh` also exakt dasselbe.
#
#   lint     ~30 s   Syntax, pyflakes, ShellCheck, Wire-Format, QML-Zugriffe,
#                    Setup/Update/Deploy in einer Sandbox
#   python           Selbsttest + Plotter-Vergleiche, auf den Python-Versionen
#                    von Raspberry Pi OS (3.11 Bookworm, 3.13 Trixie)
#   gui              ganze Oberflaeche offscreen + Zeitbudget fuer den Plotter
#   teensy           Deskriptor auf dem Host ausgefuehrt, Firmware gebaut;
#                    firmware.hex liegt danach als Artefakt am Lauf
#
# release.yml ruft diesen Workflow vor jedem Release auf (workflow_call).

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]          # Tags laufen ueber release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pds
        with: { qt: "false" }
      - run: bash tools/check_all.sh lint

  python:
    name: Python ${{ matrix.python }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pds
        with: { python: "${{ matrix.python }}" }
      - run: bash tools/check_all.sh python

  gui:
    name: Oberfläche
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pds
        with: { pyqtgraph: "true" }
      - run: bash tools/check_all.sh gui

  teensy:
    name: Teensy
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pds
        with: { qt: "false", platformio: "true" }
      - run: bash tools/check_all.sh teensy
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: teensy_firmware/.pio/build/teensy40/firmware.hex
          if-no-files-found: error
          retention-days: 30
